
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>에잇퍼센트 · 프롬프트 빌더</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
:root{
  --purple:#6741E9;--purple-mid:#7A62E0;--purple-light:#D1C6F4;--purple-xlight:#F4F2FC;
  --purple-dark:#1E0550;--purple-deep:#2D0A7A;
  --ink:#102024;--ink-2:#48525A;--ink-3:#9CA5AD;
  --line:#E0E2E5;--bg:#F1F3F5;--bg-2:#fff;--r:8px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Pretendard Variable',Pretendard,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;font-size:14px;line-height:1.6;font-weight:400;letter-spacing:-0.04em;-webkit-font-smoothing:antialiased;}

header{position:sticky;top:0;z-index:100;background:var(--purple-dark);padding:0 40px;height:64px;display:flex;align-items:center;justify-content:space-between;}
.logo{font-family:'Pretendard Variable',Pretendard,sans-serif;font-size:18px;font-weight:700;letter-spacing:-0.025em;color:#fff;}
.logo em{color:#C9A9FF;font-style:normal;font-weight:300;}
.tabs{display:flex;gap:6px;}
.tab-btn{padding:7px 20px;border-radius:20px;font-size:12.5px;cursor:pointer;border:1px solid rgba(255,255,255,.2);background:transparent;font-family:inherit;font-weight:500;letter-spacing:-0.04em;color:rgba(255,255,255,.6);transition:all .15s;}
.tab-btn:hover{color:#fff;border-color:rgba(255,255,255,.5);}
.tab-btn.active{background:var(--purple);color:#fff;border-color:var(--purple);}

.layout{display:grid;grid-template-columns:400px 1fr;min-height:calc(100vh - 64px);}
.left{background:var(--bg-2);border-right:1px solid var(--line);overflow-y:auto;max-height:calc(100vh - 64px);position:sticky;top:64px;}
.left-inner{padding:32px 28px;}
.panel-title{font-size:24px;font-weight:700;letter-spacing:-0.025em;line-height:1.5;margin-bottom:6px;}
.panel-title em{font-style:italic;color:var(--purple);}
.panel-desc{font-size:12px;color:var(--ink-3);line-height:1.65;margin-bottom:28px;}

.acc-list{display:flex;flex-direction:column;}
.acc-item{border-bottom:1px solid var(--line);}
.acc-item:first-child{border-top:1px solid var(--line);}
.acc-head{display:flex;align-items:center;gap:10px;padding:14px 0;cursor:pointer;user-select:none;transition:all .15s;}
.acc-item.open .acc-head{background:var(--purple-xlight);padding:14px 12px;border-radius:var(--r);margin:2px 0;}
.acc-head:hover .acc-name{color:var(--purple);}
.acc-num{font-size:12px;font-weight:300;color:var(--purple);min-width:22px;letter-spacing:-0.04em;}
.acc-name{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);flex:1;}
.acc-item.open .acc-name{color:var(--purple-dark);}
.acc-val{font-size:11px;color:var(--purple);font-weight:500;max-width:150px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--purple-light);padding:2px 8px;border-radius:10px;}
.acc-arrow{font-size:10px;color:var(--ink-3);transition:transform .2s;flex-shrink:0;}
.acc-item.open .acc-arrow{transform:rotate(180deg);color:var(--purple);}
.acc-body{display:none;padding:4px 0 16px;}
.acc-item.open .acc-body{display:block;}

.sub-group{margin-bottom:14px;}
.sub-label{font-size:10px;color:var(--ink-3);letter-spacing:.06em;margin-bottom:7px;padding-bottom:4px;border-bottom:1px dashed var(--line);text-transform:uppercase;}

.chips{display:flex;flex-wrap:wrap;gap:5px;}
.chip{padding:5px 13px;border:1px solid var(--line);border-radius:20px;font-size:12px;cursor:pointer;background:var(--bg);color:var(--ink-2);transition:all .12s;font-family:inherit;font-weight:400;letter-spacing:-0.04em;white-space:nowrap;}
.chip:hover{border-color:var(--purple);color:var(--purple);background:var(--purple-xlight);}
.chip.on{background:var(--purple);color:#fff;border-color:var(--purple);font-weight:500;}

.reset-btn{margin-top:24px;font-size:11.5px;color:var(--ink-3);background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:4px;opacity:.7;transition:opacity .15s;}
.reset-btn:hover{opacity:1;color:var(--ink);}

.right{padding:40px;display:flex;flex-direction:column;gap:24px;background:var(--bg);}
.section-label{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:10px;}
.section-label::after{content:'';flex:1;height:1px;background:var(--line);}

.prompt-card{background:var(--bg-2);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 8px 24px rgba(16,32,36,.07),0 2px 6px rgba(16,32,36,.04);border-top:3px solid var(--purple);}
.prompt-toolbar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:var(--purple-xlight);border-bottom:1px solid var(--line);}
.prompt-toolbar span{font-size:11px;color:var(--purple);font-weight:500;letter-spacing:.04em;}
.prompt-textarea{width:100%;min-height:160px;padding:24px;font-family:'Pretendard Variable',Pretendard,sans-serif;font-size:18px;font-weight:400;line-height:1.8;letter-spacing:-.01em;color:var(--ink);border:none;resize:none;background:transparent;outline:none;}
.prompt-textarea::placeholder{color:var(--ink-3);font-style:italic;font-size:16px;}
.prompt-footer{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-top:1px solid var(--line);background:var(--bg);}
.char-count{font-size:11.5px;color:var(--ink-3);}
.action-row{display:flex;gap:8px;}
.btn{padding:10px 22px;border-radius:var(--r);font-size:14px;font-family:inherit;cursor:pointer;transition:all .15s;font-weight:600;letter-spacing:-0.04em;}
.btn-outline{background:transparent;border:1px solid var(--line);color:var(--ink-2);}
.btn-outline:hover{border-color:var(--purple);color:var(--purple);}
.btn-fill{background:var(--purple);border:1px solid var(--purple);color:#fff;box-shadow:0 2px 8px rgba(103,65,233,.3);}
.btn-fill:hover{background:var(--purple-mid);box-shadow:0 4px 12px rgba(103,65,233,.4);}
.btn-fill:active{transform:scale(.98);}

.zone-sep{display:flex;align-items:center;gap:8px;padding:10px 20px 0;font-size:10.5px;letter-spacing:.06em;color:var(--ink-3);border-top:1px dashed var(--line);margin-top:4px;text-transform:uppercase;}
.prompt-textarea.custom{border-top:none;min-height:80px;font-size:14px;font-weight:400;color:var(--ink-2);background:transparent;}
.prompt-textarea.custom::placeholder{font-size:13px;}

.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.s-block{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;transition:border-color .15s;}
.s-key{font-size:9.5px;color:var(--ink-3);margin-bottom:3px;letter-spacing:.06em;text-transform:uppercase;}
.s-val{font-size:11.5px;color:var(--ink);line-height:1.35;min-height:15px;font-weight:400;}
.s-val.empty{color:var(--ink-3);font-style:italic;}

.history-list{display:flex;flex-direction:column;gap:8px;}
.h-item{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;font-size:12.5px;color:var(--ink-2);line-height:1.55;cursor:pointer;transition:all .15s;position:relative;box-shadow:0 1px 3px rgba(16,32,36,.06);}
.h-item:hover{border-color:var(--purple);background:var(--purple-xlight);}
.h-cat{font-size:10px;color:var(--purple);font-weight:600;margin-bottom:6px;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:6px;}
.h-cat::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--purple);flex-shrink:0;}
.h-del{position:absolute;top:12px;right:12px;font-size:14px;color:var(--ink-3);cursor:pointer;padding:2px 6px;border-radius:3px;transition:color .12s;}
.h-del:hover{color:#E24B4A;}
.no-history{font-size:12px;color:var(--ink-3);font-style:italic;}

@media(max-width:960px){
  .layout{grid-template-columns:1fr;}
  .left{position:static;max-height:none;border-right:none;border-bottom:1px solid var(--line);}
  .right{padding:24px;}
  header{padding:0 20px;}
  .summary-grid{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>

<header>
  <div class="logo">에잇퍼센트 <em>Prompt Builder</em></div>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('obj')">오브제 그래픽</button>
    <button class="tab-btn" onclick="switchTab('sc')">상황 묘사</button>
  </div>
</header>

<div id="mode-obj" class="layout">
  <aside class="left">
    <div class="left-inner">
      <h1 class="panel-title">블록을 고르면<br>문장이 <em>완성됩니다.</em></h1>
      <p class="panel-desc">항목을 클릭해 펼치고, 원하는 표현을 선택하세요. 오른쪽에 프롬프트가 실시간으로 조립됩니다.</p>
      <div class="acc-list" id="obj-acc"></div>
      <button class="reset-btn" onclick="objReset()">전체 초기화</button>
    </div>
  </aside>
  <main class="right">
    <div class="section-label">완성된 프롬프트</div>
    <div class="prompt-card">
      <div class="prompt-toolbar">
        <div style="font-size:11px;color:var(--ink-3);">블록 선택이 자동으로 반영됩니다</div>
        <span></span>
      </div>
      <textarea class="prompt-textarea" id="obj-ta" placeholder="카테고리부터 선택해주세요." onkeyup="objCountUpdate()"></textarea>
      <div class="zone-sep">직접 추가</div>
      <textarea class="prompt-textarea custom" id="obj-custom" placeholder="블록 외에 추가할 내용을 자유롭게 입력하세요. 블록 선택에 영향받지 않습니다." onkeyup="objCountUpdate()"></textarea>
      <div class="prompt-footer">
        <span class="char-count" id="obj-count">—</span>
        <div class="action-row">
          <button class="btn btn-outline" onclick="objSave()">저장</button>
          <button class="btn btn-fill" id="obj-copy-btn" onclick="objCopy()">복사하기</button>
        </div>
      </div>
    </div>
    <div class="section-label">저장된 프롬프트</div>
    <div class="history-list" id="obj-hist"><div class="no-history">저장된 프롬프트가 없습니다.</div></div>
  </main>
</div>

<div id="mode-sc" class="layout" style="display:none;">
  <aside class="left">
    <div class="left-inner">
      <h1 class="panel-title">장면을 설계하면<br>상황이 <em>완성됩니다.</em></h1>
      <p class="panel-desc">야경에 미등기 건물만 빛나는 것처럼, 장면 전체로 메시지를 전달합니다.</p>
      <div class="acc-list" id="sc-acc"></div>
      <button class="reset-btn" onclick="scReset()">전체 초기화</button>
    </div>
  </aside>
  <main class="right">
    <div class="section-label">완성된 프롬프트</div>
    <div class="prompt-card">
      <div class="prompt-toolbar">
        <div style="font-size:11px;color:var(--ink-3);">블록 선택이 자동으로 반영됩니다</div>
        <span></span>
      </div>
      <textarea class="prompt-textarea" id="sc-ta" placeholder="배경 환경부터 선택해주세요." onkeyup="scCountUpdate()"></textarea>
      <div class="zone-sep">직접 추가</div>
      <textarea class="prompt-textarea custom" id="sc-custom" placeholder="블록 외에 추가할 내용을 자유롭게 입력하세요. 블록 선택에 영향받지 않습니다." onkeyup="scCountUpdate()"></textarea>
      <div class="prompt-footer">
        <span class="char-count" id="sc-count">—</span>
        <div class="action-row">
          <button class="btn btn-outline" onclick="scSave()">저장</button>
          <button class="btn btn-fill" id="sc-copy-btn" onclick="scCopy()">복사하기</button>
        </div>
      </div>
    </div>
    <div class="section-label">선택 요약</div>
    <div class="summary-grid" id="sc-summary"></div>
    <div class="section-label">저장된 프롬프트</div>
    <div class="history-list" id="sc-hist"><div class="no-history">저장된 프롬프트가 없습니다.</div></div>
  </main>
</div>

<script>
/* ── TAB ── */
function switchTab(m){
  document.getElementById('mode-obj').style.display = m==='obj'?'grid':'none';
  document.getElementById('mode-sc').style.display  = m==='sc' ?'grid':'none';
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',(i===0&&m==='obj')||(i===1&&m==='sc')));
}

const OBJ_STEPS = ['카테고리','오브제','형태','구도','빛','표면','색상','배경','제외'];
const OBJ_LABELS = {카테고리:'카테고리',오브제:'오브제',형태:'형태',구도:'구도',빛:'빛',표면:'표면',색상:'색상',배경:'배경',제외:'제외 요소'};
const OBJ_HINTS = {오브제:'카테고리 먼저', 제외:'복수 선택'};

const objSt = {카테고리:[],오브제:[],형태:[],구도:[],빛:[],표면:[],색상:[],배경:[],제외:[]};
const objOpen = {카테고리:true};
const HIST_STORAGE_KEY = 'eightpercent_prompt_builder_history_v1';
const objHist = [];

function loadStoredHistory(){
  try{
    const raw = localStorage.getItem(HIST_STORAGE_KEY);
    if(!raw) return;
    const parsed = JSON.parse(raw);
    if(Array.isArray(parsed.obj)) objHist.splice(0,objHist.length,...parsed.obj);
    if(Array.isArray(parsed.sc)) scHist.splice(0,scHist.length,...parsed.sc);
  }catch(e){
    console.warn('저장된 히스토리를 불러오지 못했습니다.', e);
  }
}
function persistHistory(){
  try{
    localStorage.setItem(HIST_STORAGE_KEY, JSON.stringify({obj:objHist, sc:scHist}));
  }catch(e){
    console.warn('히스토리를 저장하지 못했습니다.', e);
  }
}

function objGetOpts(k){
  const d = OD[k];
  if(!d) return null;
  if(d._flat) return {_flat: d._flat};
  if(d._dep){
    const cats = objSt[d._dep];
    if(!cats.length) return null;
    const all = cats.flatMap(c => d[c]||[]);
    return {_flat:[...new Set(all)]};
  }
  return d;
}

function objRender(){
  const acc = document.getElementById('obj-acc');
  acc.innerHTML = OBJ_STEPS.map((k,idx)=>{
    const isOpen = !!objOpen[k];
    const opts = objGetOpts(k);
    const disabled = OD[k]._dep && !objSt[OD[k]._dep].length;
    const val = objSt[k].length ? objSt[k].join(' · ') : '';

    let bodyHTML = '';
    if(disabled){
      bodyHTML = `<div style="font-size:12px;color:var(--ink-3);font-style:italic;padding:4px 0">카테고리를 먼저 선택해주세요.</div>`;
    } else if(opts && opts._flat){
      bodyHTML = `<div class="chips">${opts._flat.map(o=>{
        const on = objSt[k].includes(o);
        return `<div class="chip${on?' on':''}" onclick="objPick('${k}','${esc(o)}')">${o}</div>`;
      }).join('')}</div>`;
    } else if(opts){
      bodyHTML = Object.entries(opts).map(([g,items])=>
        `<div class="sub-group"><div class="sub-label">${g}</div><div class="chips">${items.map(o=>{
          const on = objSt[k].includes(o);
          return `<div class="chip${on?' on':''}" onclick="objPick('${k}','${esc(o)}')">${o}</div>`;
        }).join('')}</div></div>`
      ).join('');
    }

    return `<div class="acc-item${isOpen?' open':''}" id="obj-acc-${k}">
      <div class="acc-head" onclick="objToggleAcc('${k}')">
        <div class="acc-num">${String(idx+1).padStart(2,'0')}</div>
        <div class="acc-name">${OBJ_LABELS[k]}${OBJ_HINTS[k]?` <span style="font-size:10px;color:var(--ink-3);font-weight:300;text-transform:none;letter-spacing:0">${OBJ_HINTS[k]}</span>`:''}</div>
        ${val ? `<div class="acc-val">${val}</div>` : ''}
        <div class="acc-arrow">▾</div>
      </div>
      <div class="acc-body">${bodyHTML}</div>
    </div>`;
  }).join('');
  objUpdatePrompt();
}

function objToggleAcc(k){ objOpen[k]=!objOpen[k]; objRender(); }
function objPick(k,v){
  const a=objSt[k]; const i=a.indexOf(v);
  i===-1?a.push(v):a.splice(i,1);
  if(k==='카테고리') objSt.오브제=[];
  objRender();
}

function objBuildPlain(){
  const s=objSt;
  if(!s.오브제.length) return '';
  let p=[];
  p.push(`${s.오브제.join(' · ')}을/를`);
  if(s.형태.length) p.push(`${s.형태.join(' · ')}으로`);
  if(s.구도.length) p.push(`${s.구도.join(' · ')} 느낌으로`);
  let mid=[];
  if(s.빛.length) mid.push(`빛은 ${s.빛.join(' · ')}`);
  if(s.표면.length) mid.push(`표면은 ${s.표면.join(' · ')}`);
  if(s.색상.length) mid.push(`색상은 ${s.색상.join(' · ')}`);
  if(mid.length) p.push(mid.join(', '));
  p.push(`배경은 ${s.배경.length?s.배경.join(' · '):'투명 PNG로'} 만들어줘`);
  let txt = p.join(', ');
  if(s.제외.length) txt+=`. ${s.제외.join('·')}는 제외해줘.`;
  else txt+='.';
  return txt;
}

function objUpdatePrompt(){
  const ta=document.getElementById('obj-ta');
  const txt=objBuildPlain();
  ta.value=txt;
  ta.placeholder=txt?'':'카테고리부터 선택해주세요.';
  objCountUpdate();
}
function objCountUpdate(){
  const a=document.getElementById('obj-ta').value.trim();
  const b=document.getElementById('obj-custom').value.trim();
  const total=(a+(b?b:'')).length;
  document.getElementById('obj-count').textContent=total?`${total}자`:'—';
  const ta=document.getElementById('obj-ta');
  ta.style.height='auto';ta.style.height=ta.scrollHeight+'px';
}
function objCombined(){
  const a=document.getElementById('obj-ta').value.trim();
  const b=document.getElementById('obj-custom').value.trim();
  return b?a+' '+b:a;
}
function objCopy(){ const t=objCombined(); if(!t) return; navigator.clipboard.writeText(t).then(()=>{ const b=document.getElementById('obj-copy-btn'); b.textContent='복사됨 ✓'; setTimeout(()=>b.textContent='복사하기',1500); }); }
function objSave(){ const t=objCombined(); if(!t) return; objHist.unshift({cat:objSt.카테고리.join('·'),obj:objSt.오브제.join('·'),text:t}); persistHistory(); objRenderHist(); }
function objRenderHist(){
  const el=document.getElementById('obj-hist');
  if(!objHist.length){el.innerHTML='<div class="no-history">저장된 프롬프트가 없습니다.</div>';return;}
  el.innerHTML=objHist.map((h,i)=>`<div class="h-item" onclick="navigator.clipboard.writeText(objHist[${i}].text)"><div class="h-cat">${[h.cat,h.obj].filter(Boolean).join(' · ')}</div>${h.text}<span class="h-del" onclick="event.stopPropagation();objDeleteHist(${i})">×</span></div>`).join('');
}
function objDeleteHist(i){ objHist.splice(i,1); persistHistory(); objRenderHist(); }
function objReset(){ Object.keys(objSt).forEach(k=>{objSt[k]=[];}); document.getElementById('obj-custom').value=''; objRender(); }

    _all:{ _flat:['전체 어둡고 포인트만 따뜻한 황금빛','차갑고 어두운 청색 계열','보랏빛 도시 야경','따뜻한 앰버·오렌지 계열','차가운 무채색에 보라 포인트','새벽의 파랗고 고요한 색감','황혼의 분홍·보라 그라데이션','흑백에 가까운 저채도 색감','안개 속 뿌연 회색 색감','차갑고 습한 비 오는 날 색감'] },
    대출:{
      '해결·희망의 색':['어둠 속에서 번지는 따뜻한 황금빛','무거운 회색을 뚫는 앰버 빛','안도감이 느껴지는 따뜻한 크림·골드','차가운 청회색에서 따뜻한 빛으로 전환'],
      '무게·대비의 색':['흑백에 가까운 저채도에 한 줄기 빛','어두운 무채색에 황금 포인트','차갑고 습한 색감에서 따뜻함으로','안개 속 뿌연 회색 색감']
    },
    투자:{
      '성장·풍요의 색':['황금빛 풍요 (앰버·골드)','번영의 따뜻한 오렌지-골드','상승하는 그라데이션 (블루→골드)','선명하고 채도 높은 활기찬 색감'],
      '신뢰·세련의 색':['차가운 무채색에 보라·블루 포인트','보랏빛 도시 야경 (세련된)','딥 블루와 골드의 대비','전체 어둡고 포인트만 따뜻한 황금빛']
    }
  },
  앵글: { _flat:['아래에서 위로 올려다보는','위에서 아래로 내려다보는','거리 수준의 정면 시선','창문 너머로 바라보는','멀리서 전경을 바라보는','클로즈업으로 바짝 당긴','비스듬한 사선 구도','골목 끝에서 바라보는 원근감'] },
  분위기: {
    _dep:'카테고리',
    _all:{ _flat:['신비롭고 조용한','따뜻하고 희망적인','긴박하고 드라마틱한','쓸쓸하지만 아름다운','차갑고 긴장감 있는','평온하고 안도감 있는','웅장하고 압도적인','미래적이고 세련된','고즈넉하고 서정적인','낯설면서도 친숙한'] },
    대출:{
      '해방·안도':['무거운 짐이 내려지는 안도감','막혀있던 것이 뚫리는 해방감','따뜻하고 희망적인','평온하고 안도감 있는','숨통이 트이는 느낌'],
      '무게·전환':['묵직하지만 곧 바뀔 긴장감','쓸쓸하지만 곧 나아지는','조용하지만 변화가 시작되는','긴박하지 않고 진지한']
    },
    투자:{
      '자신감·성장':['자신감 넘치고 여유로운','웅장하고 압도적인','풍요롭고 안정적인','미래적이고 세련된'],
      '활기·기대':['따뜻하고 희망적인','고요하지만 힘이 느껴지는','설레고 기대감이 차오르는','든든하고 신뢰감 있는']
    }
  },
  제외: { _flat:['글자·간판','사람 실루엣','자동차','과도한 장식','복잡한 전선·구조물','플래시·과한 빛 번짐','현수막','로고'] }
};

const SC_STEPS = ['카테고리','환경','핵심요소','시간대','조명','색감','앵글','분위기','제외'];
const SC_LABELS = {카테고리:'카테고리',환경:'배경 환경',핵심요소:'핵심 요소',시간대:'시간대',조명:'조명 처리',색감:'색감',앵글:'카메라 앵글',분위기:'분위기',제외:'제외 요소'};
const SC_HINTS = {핵심요소:'카테고리 맞춤',시간대:'카테고리 맞춤',조명:'카테고리 맞춤',색감:'카테고리 맞춤',분위기:'카테고리 맞춤'};

const scSt = {카테고리:[],환경:[],핵심요소:[],시간대:[],조명:[],색감:[],앵글:[],분위기:[],제외:[]};
const scOpen = {카테고리:true};
const scHist = [];

function scGetOpts(k){
  const d = SD[k];
  if(!d) return null;
  if(d._dep){
    const cats = scSt[d._dep];
    if(!cats.length) return d._all || null;
    const merged = {};
    cats.forEach(cat => {
      if(d[cat]) Object.entries(d[cat]).forEach(([g,items]) => {
        if(!merged[g]) merged[g] = [];
        merged[g] = [...new Set([...merged[g], ...items])];
      });
    });
    return Object.keys(merged).length ? merged : (d._all || null);
  }
  if(d._flat) return {_flat:d._flat};
  return d;
}

function scRender(){
  const acc=document.getElementById('sc-acc');
  acc.innerHTML=SC_STEPS.map((k,idx)=>{
    const isOpen=!!scOpen[k];
    const opts=scGetOpts(k);
    const val=scSt[k].length?scSt[k].join(' · '):'';
    const dep = SD[k] && SD[k]._dep;
    const depEmpty = dep && !scSt[dep].length && !SD[k]._all;
    let bodyHTML='';
    if(depEmpty){
      bodyHTML=`<div style="font-size:12px;color:var(--ink-3);font-style:italic;padding:4px 0">카테고리를 먼저 선택하면 맞춤 예시가 나타납니다.</div>`;
    } else if(opts&&opts._flat){
      bodyHTML=`<div class="chips">${opts._flat.map(o=>{
        const on=scSt[k].includes(o);
        return `<div class="chip${on?' on':''}" onclick="scPick('${k}','${esc(o)}')">${o}</div>`;
      }).join('')}</div>`;
    } else if(opts){
      bodyHTML=Object.entries(opts).map(([g,items])=>
        `<div class="sub-group"><div class="sub-label">${g}</div><div class="chips">${items.map(o=>{
          const on=scSt[k].includes(o);
          return `<div class="chip${on?' on':''}" onclick="scPick('${k}','${esc(o)}')">${o}</div>`;
        }).join('')}</div></div>`
      ).join('');
    }
    return `<div class="acc-item${isOpen?' open':''}" id="sc-acc-${k}">
      <div class="acc-head" onclick="scToggleAcc('${k}')">
        <div class="acc-num">${String(idx+1).padStart(2,'0')}</div>
        <div class="acc-name">${SC_LABELS[k]}${SC_HINTS[k]?` <span style="font-size:10px;color:var(--ink-3);font-weight:300;text-transform:none;letter-spacing:0">${SC_HINTS[k]}</span>`:''}</div>
        ${val?`<div class="acc-val">${val}</div>`:''}
        <div class="acc-arrow">▾</div>
      </div>
      <div class="acc-body">${bodyHTML}</div>
    </div>`;
  }).join('');
  scUpdatePrompt();
  scUpdateSummary();
}

function scToggleAcc(k){ scOpen[k]=!scOpen[k]; scRender(); }
function scPick(k,v){
  const a=scSt[k]; const i=a.indexOf(v);
  i===-1?a.push(v):a.splice(i,1);
  if(k==='카테고리') scSt.핵심요소=[];
  scRender();
}

function scBuildPlain(){
  const s=scSt;
  if(!s.환경.length&&!s.핵심요소.length) return '';
  let p=[];
  if(s.환경.length&&s.시간대.length) p.push(`${s.시간대.join(' · ')} ${s.환경.join(' · ')}을 배경으로`);
  else if(s.환경.length) p.push(`${s.환경.join(' · ')}을 배경으로`);
  if(s.핵심요소.length) p.push(`${s.핵심요소.join(' · ')} 장면`);
  if(s.조명.length) p.push(`조명은 ${s.조명.join(' · ')}`);
  if(s.색감.length) p.push(`색감은 ${s.색감.join(' · ')}`);
  if(s.앵글.length) p.push(`${s.앵글.join(' · ')} 구도`);
  if(s.분위기.length) p.push(`${s.분위기.join(' · ')} 느낌으로 만들어줘`);
  else if(p.length) p[p.length-1]+=' 만들어줘';
  let txt=p.join(', ');
  if(s.제외.length) txt+=`. ${s.제외.join('·')}는 제외해줘.`;
  else txt+='.';
  return txt;
}

function scUpdatePrompt(){
  const ta=document.getElementById('sc-ta');
  const txt=scBuildPlain();
  ta.value=txt;
  scCountUpdate();
}
function scCountUpdate(){
  const a=document.getElementById('sc-ta').value.trim();
  const b=document.getElementById('sc-custom').value.trim();
  const total=(a+(b?b:'')).length;
  document.getElementById('sc-count').textContent=total?`${total}자`:'—';
  const ta=document.getElementById('sc-ta');
  ta.style.height='auto';ta.style.height=ta.scrollHeight+'px';
}
function scCombined(){
  const a=document.getElementById('sc-ta').value.trim();
  const b=document.getElementById('sc-custom').value.trim();
  return b?a+' '+b:a;
}
function scCopy(){ const t=scCombined(); if(!t) return; navigator.clipboard.writeText(t).then(()=>{ const b=document.getElementById('sc-copy-btn'); b.textContent='복사됨 ✓'; setTimeout(()=>b.textContent='복사하기',1500); }); }
function scSave(){ const t=scCombined(); if(!t) return; scHist.unshift({cat:scSt.카테고리.join('·'),env:scSt.환경.join('·'),elem:scSt.핵심요소.join('·'),text:t}); persistHistory(); scRenderHist(); }
function scRenderHist(){
  const el=document.getElementById('sc-hist');
  if(!scHist.length){el.innerHTML='<div class="no-history">저장된 프롬프트가 없습니다.</div>';return;}
  el.innerHTML=scHist.map((h,i)=>`<div class="h-item" onclick="navigator.clipboard.writeText(scHist[${i}].text)"><div class="h-cat">${[h.cat,h.env,h.elem].filter(Boolean).join(' · ')}</div>${h.text}<span class="h-del" onclick="event.stopPropagation();scDeleteHist(${i})">×</span></div>`).join('');
}
function scDeleteHist(i){ scHist.splice(i,1); persistHistory(); scRenderHist(); }
function scUpdateSummary(){
  const keys=[{k:'환경',l:'배경 환경'},{k:'핵심요소',l:'핵심 요소'},{k:'시간대',l:'시간대'},{k:'조명',l:'조명'},{k:'색감',l:'색감'},{k:'앵글',l:'앵글'},{k:'분위기',l:'분위기'},{k:'제외',l:'제외'}];
  document.getElementById('sc-summary').innerHTML=keys.map(({k,l})=>{
    const v=scSt[k].length?scSt[k].join(' · '):null;
    return `<div class="s-block"><div class="s-key">${l}</div><div class="s-val${v?'':' empty'}">${v||'—'}</div></div>`;
  }).join('');
}
function scReset(){ Object.keys(scSt).forEach(k=>{scSt[k]=[];}); document.getElementById('sc-custom').value=''; scRender(); }

/* ── UTIL ── */
function esc(s){ return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

/* ── INIT ── */
loadStoredHistory();
objRender(); objRenderHist();
scRender(); scRenderHist();
</script>
