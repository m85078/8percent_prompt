<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>에잇퍼센트 · 프롬프트 빌더</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#5A0ADE;--purple-light:#EDE4FF;--purple-mid:#7B3AEE;
  --ink:#111014;--ink-2:#3A3842;--ink-3:#7A7884;
  --line:#E5E3DE;--line-2:#D8D5CE;--bg:#F8F6F0;--bg-2:#fff;--r:6px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;font-size:14px;line-height:1.6;font-weight:300;-webkit-font-smoothing:antialiased;}

/* HEADER */
header{position:sticky;top:0;z-index:100;background:rgba(248,246,240,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:0 40px;height:60px;display:flex;align-items:center;justify-content:space-between;}
.logo{font-family:'Instrument Serif',serif;font-size:20px;letter-spacing:-.01em;}
.logo em{color:var(--purple);font-style:italic;}
.tabs{display:flex;gap:4px;}
.tab-btn{padding:7px 18px;border-radius:20px;font-size:12.5px;cursor:pointer;border:1px solid transparent;background:transparent;font-family:inherit;font-weight:300;color:var(--ink-3);transition:all .15s;}
.tab-btn:hover{color:var(--ink-2);border-color:var(--line);}
.tab-btn.active{color:var(--purple);border-color:var(--purple);background:var(--purple-light);}

/* LAYOUT */
.layout{display:grid;grid-template-columns:400px 1fr;min-height:calc(100vh - 60px);}
.left{border-right:1px solid var(--line);overflow-y:auto;max-height:calc(100vh - 60px);position:sticky;top:60px;}
.left-inner{padding:32px 28px;}
.panel-title{font-family:'Instrument Serif',serif;font-size:26px;font-weight:400;letter-spacing:-.02em;line-height:1.1;margin-bottom:6px;}
.panel-title em{font-style:italic;color:var(--purple);}
.panel-desc{font-size:12px;color:var(--ink-3);line-height:1.65;margin-bottom:28px;}

/* ACCORDION */
.acc-list{display:flex;flex-direction:column;gap:0;}
.acc-item{border-bottom:1px solid var(--line);}
.acc-item:first-child{border-top:1px solid var(--line);}

.acc-head{
  display:flex;align-items:center;gap:10px;
  padding:14px 0;cursor:pointer;user-select:none;
  transition:background .1s;
}
.acc-head:hover .acc-name{color:var(--ink);}
.acc-num{font-family:'Instrument Serif',serif;font-style:italic;font-size:12px;color:var(--purple);min-width:20px;}
.acc-name{font-size:12px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);flex:1;}
.acc-val{font-size:11.5px;color:var(--purple);font-weight:500;max-width:160px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.acc-arrow{font-size:11px;color:var(--ink-3);margin-left:6px;transition:transform .2s;flex-shrink:0;}
.acc-item.open .acc-arrow{transform:rotate(180deg);}

.acc-body{display:none;padding-bottom:16px;}
.acc-item.open .acc-body{display:block;}

/* SUB-GROUPS */
.sub-group{margin-bottom:14px;}
.sub-label{font-size:10.5px;color:var(--ink-3);letter-spacing:.05em;margin-bottom:7px;padding-bottom:4px;border-bottom:1px dashed var(--line);}

/* CHIPS */
.chips{display:flex;flex-wrap:wrap;gap:5px;}
.chip{padding:5px 12px;border:1px solid var(--line);border-radius:20px;font-size:12px;cursor:pointer;background:var(--bg-2);color:var(--ink-2);transition:all .12s;font-family:inherit;font-weight:300;white-space:nowrap;}
.chip:hover{border-color:var(--purple);color:var(--purple);}
.chip.on{background:var(--purple);color:#fff;border-color:var(--purple);}
.chip.multi.on{background:#F0FBF4;color:#1A6B3C;border-color:#5AC87A;}

.reset-btn{margin-top:20px;font-size:12px;color:var(--ink-3);background:none;border:none;cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;}
.reset-btn:hover{color:var(--ink);}

/* RIGHT */
.right{padding:40px;display:flex;flex-direction:column;gap:20px;}
.section-label{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:10px;}
.section-label::after{content:'';flex:1;height:1px;background:var(--line);}

/* PROMPT AREA */
.prompt-card{background:var(--bg-2);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.prompt-toolbar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--line);}
.prompt-mode{display:flex;gap:4px;}
.mode-badge{font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid var(--line);color:var(--ink-3);cursor:pointer;transition:all .12s;}
.mode-badge.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.reassemble-btn{font-size:11.5px;color:var(--purple);background:none;border:none;cursor:pointer;padding:3px 0;display:none;}
.reassemble-btn.visible{display:block;}

.prompt-textarea{
  width:100%;min-height:200px;padding:24px;
  font-family:'Noto Sans KR',sans-serif;font-size:20px;font-weight:300;
  line-height:1.75;letter-spacing:-.01em;color:var(--ink);
  border:none;resize:none;background:transparent;outline:none;
}
.prompt-textarea::placeholder{color:var(--ink-3);font-style:italic;}

.prompt-footer{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-top:1px solid var(--line);}
.char-count{font-size:12px;color:var(--ink-3);}
.action-row{display:flex;gap:8px;}
.btn{padding:8px 18px;border-radius:var(--r);font-size:13px;font-family:inherit;cursor:pointer;transition:all .12s;}
.btn-outline{background:transparent;border:1px solid var(--line);color:var(--ink-2);}
.btn-outline:hover{border-color:var(--ink-2);}
.btn-fill{background:var(--purple);border:1px solid var(--purple);color:#fff;}
.btn-fill:hover{background:var(--purple-mid);}

/* SUMMARY GRID */
.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.s-block{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;}
.s-key{font-size:10px;color:var(--ink-3);margin-bottom:3px;letter-spacing:.05em;}
.s-val{font-size:12px;color:var(--ink);line-height:1.35;min-height:15px;}
.s-val.empty{color:var(--ink-3);font-style:italic;}

/* HISTORY */
.history-list{display:flex;flex-direction:column;gap:8px;}
.h-item{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;font-size:12.5px;color:var(--ink-2);line-height:1.55;cursor:pointer;transition:border-color .12s;position:relative;}
.h-item:hover{border-color:var(--purple);}
.h-cat{font-size:10.5px;color:var(--purple);font-weight:500;margin-bottom:4px;}
.h-del{position:absolute;top:12px;right:12px;font-size:14px;color:var(--ink-3);cursor:pointer;padding:2px 6px;border-radius:3px;}
.h-del:hover{color:#E24B4A;}
.no-history{font-size:12px;color:var(--ink-3);font-style:italic;}

@media(max-width:960px){
  .layout{grid-template-columns:1fr;}
  .left{position:static;max-height:none;border-right:none;border-bottom:1px solid var(--line);}
  .right{padding:24px;}
  header{padding:0 20px;}
  .summary-grid{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>

<header>
  <div class="logo">에잇퍼센트 <em>Prompt Builder</em></div>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('obj')">오브제 그래픽</button>
    <button class="tab-btn" onclick="switchTab('sc')">상황 묘사</button>
  </div>
</header>

<div id="mode-obj" class="layout">
  <aside class="left">
    <div class="left-inner">
      <h1 class="panel-title">블록을 고르면<br>문장이 <em>완성됩니다.</em></h1>
      <p class="panel-desc">항목을 클릭해 펼치고, 원하는 표현을 선택하세요. 오른쪽에 프롬프트가 실시간으로 조립됩니다.</p>
      <div class="acc-list" id="obj-acc"></div>
      <button class="reset-btn" onclick="objReset()">전체 초기화</button>
    </div>
  </aside>
  <main class="right">
    <div class="section-label">완성된 프롬프트</div>
    <div class="prompt-card">
      <div class="prompt-toolbar">
        <div class="prompt-mode" style="display:none;"></div>
        <button class="reassemble-btn" id="obj-reassemble" onclick="objReassemble()">↺ 자동 조립으로 되돌리기</button>
        <span></span>
      </div>
      <textarea class="prompt-textarea" id="obj-ta" placeholder="카테고리부터 선택해주세요." oninput="objDirty()" onkeyup="objCountUpdate()"></textarea>
      <div class="prompt-footer">
        <span class="char-count" id="obj-count">—</span>
        <div class="action-row">
          <button class="btn btn-outline" onclick="objSave()">저장</button>
          <button class="btn btn-fill" id="obj-copy-btn" onclick="objCopy()">복사하기</button>
        </div>
      </div>
    </div>
    <div class="section-label">저장된 프롬프트</div>
    <div class="history-list" id="obj-hist"><div class="no-history">저장된 프롬프트가 없습니다.</div></div>
  </main>
</div>

<div id="mode-sc" class="layout" style="display:none;">
  <aside class="left">
    <div class="left-inner">
      <h1 class="panel-title">장면을 설계하면<br>상황이 <em>완성됩니다.</em></h1>
      <p class="panel-desc">야경에 미등기 건물만 빛나는 것처럼, 장면 전체로 메시지를 전달합니다.</p>
      <div class="acc-list" id="sc-acc"></div>
      <button class="reset-btn" onclick="scReset()">전체 초기화</button>
    </div>
  </aside>
  <main class="right">
    <div class="section-label">완성된 프롬프트</div>
    <div class="prompt-card">
      <div class="prompt-toolbar">
        <div class="prompt-mode" style="display:none;"></div>
        <button class="reassemble-btn" id="sc-reassemble" onclick="scReassemble()">↺ 자동 조립으로 되돌리기</button>
        <span></span>
      </div>
      <textarea class="prompt-textarea" id="sc-ta" placeholder="배경 환경부터 선택해주세요." oninput="scDirty()" onkeyup="scCountUpdate()"></textarea>
      <div class="prompt-footer">
        <span class="char-count" id="sc-count">—</span>
        <div class="action-row">
          <button class="btn btn-outline" onclick="scSave()">저장</button>
          <button class="btn btn-fill" id="sc-copy-btn" onclick="scCopy()">복사하기</button>
        </div>
      </div>
    </div>
    <div class="section-label">선택 요약</div>
    <div class="summary-grid" id="sc-summary"></div>
    <div class="section-label">저장된 프롬프트</div>
    <div class="history-list" id="sc-hist"><div class="no-history">저장된 프롬프트가 없습니다.</div></div>
  </main>
</div>

<script>
/* ── TAB ── */
function switchTab(m){
  document.getElementById('mode-obj').style.display = m==='obj'?'grid':'none';
  document.getElementById('mode-sc').style.display  = m==='sc' ?'grid':'none';
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',(i===0&&m==='obj')||(i===1&&m==='sc')));
}

const OBJ_STEPS = ['카테고리','오브제','형태','구도','빛','표면','색상','배경','제외'];
const OBJ_LABELS = {카테고리:'카테고리',오브제:'오브제',형태:'형태',구도:'구도',빛:'빛',표면:'표면',색상:'색상',배경:'배경',제외:'제외 요소'};
const OBJ_HINTS = {오브제:'카테고리 먼저', 제외:'복수 선택'};

const objSt = {카테고리:[],오브제:[],형태:[],구도:[],빛:[],표면:[],색상:[],배경:[],제외:[]};
const objOpen = {카테고리:true};
let objDirtyFlag = false;
const objHist = [];

function objGetOpts(k){
  const d = OD[k];
  if(!d) return null;
  if(d._flat) return {_flat: d._flat};
  if(d._dep){
    const cats = objSt[d._dep];
    if(!cats.length) return null;
    const all = cats.flatMap(c => d[c]||[]);
    return {_flat:[...new Set(all)]};
  }
  return d;
}

function objRender(){
  const acc = document.getElementById('obj-acc');
  acc.innerHTML = OBJ_STEPS.map((k,idx)=>{
    const isOpen = !!objOpen[k];
    const opts = objGetOpts(k);
    const disabled = OD[k]._dep && !objSt[OD[k]._dep].length;
    const val = objSt[k].length ? objSt[k].join(' · ') : '';

    let bodyHTML = '';
    if(disabled){
      bodyHTML = `<div style="font-size:12px;color:var(--ink-3);font-style:italic;padding:4px 0">카테고리를 먼저 선택해주세요.</div>`;
    } else if(opts && opts._flat){
      bodyHTML = `<div class="chips">${opts._flat.map(o=>{
        const on = objSt[k].includes(o);
        return `<div class="chip${on?' on':''}" onclick="objPick('${k}','${esc(o)}')">${o}</div>`;
      }).join('')}</div>`;
    } else if(opts){
      bodyHTML = Object.entries(opts).map(([g,items])=>
        `<div class="sub-group"><div class="sub-label">${g}</div><div class="chips">${items.map(o=>{
          const on = objSt[k].includes(o);
          return `<div class="chip${on?' on':''}" onclick="objPick('${k}','${esc(o)}')">${o}</div>`;
        }).join('')}</div></div>`
      ).join('');
    }

    return `<div class="acc-item${isOpen?' open':''}" id="obj-acc-${k}">
      <div class="acc-head" onclick="objToggleAcc('${k}')">
        <div class="acc-num">${String(idx+1).padStart(2,'0')}</div>
        <div class="acc-name">${OBJ_LABELS[k]}${OBJ_HINTS[k]?` <span style="font-size:10px;color:var(--ink-3);font-weight:300;text-transform:none;letter-spacing:0">${OBJ_HINTS[k]}</span>`:''}</div>
        ${val ? `<div class="acc-val">${val}</div>` : ''}
        <div class="acc-arrow">▾</div>
      </div>
      <div class="acc-body">${bodyHTML}</div>
    </div>`;
  }).join('');
  objUpdatePrompt();
}

function objToggleAcc(k){ objOpen[k]=!objOpen[k]; objRender(); }
function objPick(k,v){
  const a=objSt[k]; const i=a.indexOf(v);
  i===-1?a.push(v):a.splice(i,1);
  if(k==='카테고리') objSt.오브제=[];
  objRender();
}

function objBuildPlain(){
  const s=objSt;
  if(!s.오브제.length) return '';
  let p=[];
  p.push(`${s.오브제.join(' · ')}을/를`);
  if(s.형태.length) p.push(`${s.형태.join(' · ')}으로`);
  if(s.구도.length) p.push(`${s.구도.join(' · ')} 느낌으로`);
  let mid=[];
  if(s.빛.length) mid.push(`빛은 ${s.빛.join(' · ')}`);
  if(s.표면.length) mid.push(`표면은 ${s.표면.join(' · ')}`);
  if(s.색상.length) mid.push(`색상은 ${s.색상.join(' · ')}`);
  if(mid.length) p.push(mid.join(', '));
  p.push(`배경은 ${s.배경.length?s.배경.join(' · '):'투명 PNG로'} 만들어줘`);
  let txt = p.join(', ');
  if(s.제외.length) txt+=`. ${s.제외.join('·')}는 제외해줘.`;
  else txt+='.';
  return txt;
}

function objUpdatePrompt(){
  if(objDirtyFlag) return;
  const ta=document.getElementById('obj-ta');
  const txt=objBuildPlain();
  ta.value=txt;
  ta.placeholder = txt ? '' : '카테고리부터 선택해주세요.';
  objCountUpdate();
}
function objCountUpdate(){
  const ta=document.getElementById('obj-ta');
  document.getElementById('obj-count').textContent = ta.value ? `${ta.value.length}자` : '—';
  ta.style.height='auto'; ta.style.height=ta.scrollHeight+'px';
}
function objDirty(){
  objDirtyFlag=true;
  document.getElementById('obj-reassemble').classList.add('visible');
  objCountUpdate();
}
function objReassemble(){
  objDirtyFlag=false;
  document.getElementById('obj-reassemble').classList.remove('visible');
  objUpdatePrompt();
}
function objCopy(){ const ta=document.getElementById('obj-ta'); if(!ta.value) return; navigator.clipboard.writeText(ta.value).then(()=>{ const b=document.getElementById('obj-copy-btn'); b.textContent='복사됨 ✓'; setTimeout(()=>b.textContent='복사하기',1500); }); }
function objSave(){ const ta=document.getElementById('obj-ta'); if(!ta.value) return; objHist.unshift({cat:objSt.카테고리,obj:objSt.오브제,text:ta.value}); objRenderHist(); }
function objRenderHist(){
  const el=document.getElementById('obj-hist');
  if(!objHist.length){el.innerHTML='<div class="no-history">저장된 프롬프트가 없습니다.</div>';return;}
  el.innerHTML=objHist.map((h,i)=>`<div class="h-item" onclick="navigator.clipboard.writeText(objHist[${i}].text)"><div class="h-cat">${[h.cat,h.obj].filter(Boolean).join(' · ')}</div>${h.text}<span class="h-del" onclick="event.stopPropagation();objHist.splice(${i},1);objRenderHist()">×</span></div>`).join('');
}
function objReset(){ Object.keys(objSt).forEach(k=>{objSt[k]=[];}); objDirtyFlag=false; document.getElementById('obj-reassemble').classList.remove('visible'); objRender(); }

  const keys=[{k:'환경',l:'배경 환경'},{k:'핵심요소',l:'핵심 요소'},{k:'시간대',l:'시간대'},{k:'조명',l:'조명'},{k:'색감',l:'색감'},{k:'앵글',l:'앵글'},{k:'분위기',l:'분위기'},{k:'제외',l:'제외'}];
  document.getElementById('sc-summary').innerHTML=keys.map(({k,l})=>{
    const v=scSt[k].length?scSt[k].join(' · '):null;
    return `<div class="s-block"><div class="s-key">${l}</div><div class="s-val${v?'':' empty'}">${v||'—'}</div></div>`;
  }).join('');
}
function scReset(){ Object.keys(scSt).forEach(k=>{scSt[k]=[];}); scDirtyFlag=false; document.getElementById('sc-reassemble').classList.remove('visible'); scRender(); }

/* ── UTIL ── */
function esc(s){ return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

/* ── INIT ── */
objRender(); objRenderHist();
scRender(); scRenderHist();
</script>
