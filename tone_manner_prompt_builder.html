<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>에잇퍼센트 · 톤앤매너 프롬프트 빌더</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
:root{
  --purple:#6741E9;--purple-mid:#7A62E0;--purple-light:#D1C6F4;--purple-xlight:#F4F2FC;
  --purple-dark:#1E0550;--ink:#102024;--ink-2:#48525A;--ink-3:#9CA5AD;
  --line:#E0E2E5;--bg:#F1F3F5;--bg-2:#fff;--r:8px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Pretendard Variable',Pretendard,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;font-size:14px;line-height:1.6;font-weight:400;letter-spacing:-0.04em;-webkit-font-smoothing:antialiased;}
header{position:sticky;top:0;z-index:10;height:64px;padding:0 40px;background:var(--purple-dark);display:flex;align-items:center;justify-content:space-between;}
.brand{display:flex;align-items:center;gap:12px;min-width:0;}
.brand-logo{display:block;width:27px;height:auto;flex-shrink:0;}
.brand-divider{width:1px;height:18px;background:rgba(255,255,255,.24);flex-shrink:0;}
.brand-title{font-size:15px;font-weight:700;letter-spacing:-0.025em;color:#fff;white-space:nowrap;}
.header-actions{display:flex;align-items:center;gap:16px;}
.back-link{border:1px solid rgba(255,255,255,.24);border-radius:999px;color:rgba(255,255,255,.82);text-decoration:none;font-size:12px;font-weight:700;padding:7px 12px;transition:all .15s;}
.back-link:hover{border-color:rgba(255,255,255,.5);color:#fff;background:rgba(255,255,255,.08);}
.header-note{font-size:12px;color:rgba(255,255,255,.62);}
.layout{display:grid;grid-template-columns:420px 1fr;min-height:calc(100vh - 64px);}
.left{background:var(--bg-2);border-right:1px solid var(--line);position:sticky;top:64px;max-height:calc(100vh - 64px);overflow-y:auto;}
.left-inner{padding:32px 28px;}
.panel-title{font-size:28px;font-weight:800;letter-spacing:-0.025em;line-height:1.35;margin-bottom:8px;}
.panel-title span{color:var(--purple);}
.panel-desc{font-size:12px;color:var(--ink-3);line-height:1.65;margin-bottom:26px;}
.section-title{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:24px 0 10px;}
.preset-list{display:flex;flex-direction:column;gap:8px;}
.preset-btn{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:14px;text-align:left;cursor:pointer;transition:all .15s;font-family:inherit;color:var(--ink);}
.preset-btn:hover{border-color:var(--purple);background:var(--purple-xlight);}
.preset-btn.active{border-color:var(--purple);background:var(--purple-xlight);box-shadow:0 0 0 3px rgba(103,65,233,.12);}
.preset-name{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:4px;letter-spacing:-0.04em;}
.preset-chip{font-size:10px;color:var(--purple);background:#fff;border:1px solid var(--purple-light);border-radius:999px;padding:2px 7px;font-weight:700;}
.preset-desc{font-size:12px;color:var(--ink-3);line-height:1.45;}
.field-list{display:flex;flex-direction:column;gap:12px;}
.field label{display:block;font-size:11px;font-weight:700;color:var(--ink-2);margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:11px 12px;font-family:inherit;font-size:13px;color:var(--ink);letter-spacing:-0.04em;outline:none;}
.field textarea{min-height:76px;resize:vertical;line-height:1.55;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(103,65,233,.12);}
.hint{font-size:11px;color:var(--ink-3);margin-top:5px;}
.right{padding:40px;display:flex;flex-direction:column;gap:24px;}
.prompt-card{background:var(--bg-2);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 8px 24px rgba(16,32,36,.07),0 2px 6px rgba(16,32,36,.04);}
.prompt-toolbar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:var(--purple-xlight);border-bottom:1px solid var(--line);}
.prompt-toolbar span{font-size:11px;color:var(--purple);font-weight:700;letter-spacing:.04em;text-transform:uppercase;}
.prompt-textarea{width:100%;min-height:430px;padding:24px;border:none;background:transparent;resize:vertical;outline:none;font-family:'Pretendard Variable',Pretendard,sans-serif;font-size:16px;font-weight:400;line-height:1.75;color:var(--ink);letter-spacing:-.02em;}
.prompt-footer{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-top:1px solid var(--line);background:var(--bg);}
.char-count{font-size:11.5px;color:var(--ink-3);}
.action-row{display:flex;gap:8px;}
.btn{padding:10px 18px;border-radius:var(--r);font-size:14px;font-family:inherit;cursor:pointer;transition:all .15s;font-weight:700;letter-spacing:-0.04em;}
.btn-outline{background:transparent;border:1px solid var(--line);color:var(--ink-2);}
.btn-outline:hover{border-color:var(--purple);color:var(--purple);}
.btn-fill{background:var(--purple);border:1px solid var(--purple);color:#fff;box-shadow:0 2px 8px rgba(103,65,233,.3);}
.btn-fill:hover{background:var(--purple-mid);}
.history-list{display:flex;flex-direction:column;gap:8px;}
.history-tools{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:-10px;}
.history-tool{border:1px solid var(--line);border-radius:var(--r);background:#fff;color:var(--ink-2);font-family:inherit;font-size:11.5px;font-weight:700;padding:7px 10px;cursor:pointer;transition:all .15s;}
.history-tool:hover{border-color:var(--purple);color:var(--purple);background:var(--purple-xlight);}
.section-label{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:10px;}
.section-label::after{content:'';flex:1;height:1px;background:var(--line);}
.h-item{position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 40px 14px 16px;font-size:12.5px;color:var(--ink-2);line-height:1.55;cursor:pointer;box-shadow:0 1px 3px rgba(16,32,36,.06);}
.h-item:hover{border-color:var(--purple);background:var(--purple-xlight);}
.h-cat{font-size:10px;color:var(--purple);font-weight:700;margin-bottom:6px;letter-spacing:.04em;text-transform:uppercase;}
.h-del{position:absolute;top:12px;right:12px;font-size:14px;color:var(--ink-3);cursor:pointer;padding:2px 6px;border-radius:3px;}
.h-del:hover{color:#E24B4A;}
.empty{font-size:12px;color:var(--ink-3);}
@media(max-width:960px){
  header{padding:0 20px;}
  .header-note{display:none;}
  .layout{grid-template-columns:1fr;}
  .left{position:static;max-height:none;border-right:none;border-bottom:1px solid var(--line);}
  .right{padding:24px;}
}
@media(max-width:640px){
  .brand-title{font-size:14px;}
  .header-actions{gap:8px;}
  .back-link{padding:7px 10px;}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <img class="brand-logo" src="eds/logo/Symbol_white.svg" alt="8퍼센트">
    <span class="brand-divider"></span>
    <span class="brand-title">Tone Prompt Builder</span>
  </div>
  <div class="header-actions">
    <a class="back-link" href="index.html">← 툴킷으로</a>
    <div class="header-note">톤앤매너별 완성 프롬프트 템플릿</div>
  </div>
</header>
<input id="history-import-input" type="file" accept="application/json,.json" hidden onchange="importToneHistory(event)">

<div class="layout">
  <aside class="left">
    <div class="left-inner">
      <h1 class="panel-title">스타일을 고르면<br>프롬프트가 <span>완성됩니다.</span></h1>
      <p class="panel-desc">톤앤매너 프리셋을 선택하고 필요한 빈칸만 채우세요. 이미지 생성 도구에 바로 붙여넣을 수 있는 문장으로 정리됩니다.</p>

      <div class="section-title">Tone Preset</div>
      <div class="preset-list" id="preset-list"></div>

      <div class="section-title">Inputs</div>
      <div class="field-list" id="field-list"></div>
    </div>
  </aside>

  <main class="right">
    <section class="prompt-card">
      <div class="prompt-toolbar">
        <span id="prompt-title">완성 프롬프트</span>
        <span>자동 조립</span>
      </div>
      <textarea class="prompt-textarea" id="prompt-output" spellcheck="false"></textarea>
      <div class="prompt-footer">
        <div class="char-count" id="count">—</div>
        <div class="action-row">
          <button class="btn btn-outline" onclick="savePrompt()">저장</button>
          <button class="btn btn-fill" id="copy-btn" onclick="copyPrompt()">복사하기</button>
        </div>
      </div>
    </section>

    <div class="section-label">저장된 톤앤매너 프롬프트</div>
    <div class="history-tools">
      <button class="history-tool" onclick="exportToneHistory()">히스토리 내보내기</button>
      <button class="history-tool" onclick="document.getElementById('history-import-input').click()">가져오기</button>
    </div>
    <div class="history-list" id="history-list"><div class="empty">저장된 프롬프트가 없습니다.</div></div>
  </main>
</div>

<script>
const STORAGE_KEY = 'eightpercent_tone_manner_prompt_history_v1';

const presets = [
  {
    id:'matte3d',
    name:'3D 매트 아이콘',
    tag:'object',
    desc:'투명 PNG용 단일 오브제, 부드러운 입체감과 매트 질감',
    fields:[
      {id:'object',label:'오브제 이름',type:'text',placeholder:'예: 보라색 열쇠, 승인 도장, 집 모형'},
      {id:'material',label:'재질감',type:'select',options:['플라스틱','금속','유리','고무','클레이','세라믹','패브릭']},
      {id:'angle',label:'구도',type:'select',options:['정면','45도 기울어진 각도','앞에서 바로 보는 느낌','살짝 위에서 내려다보는 느낌']},
      {id:'color',label:'색상 방향',type:'text',placeholder:'예: 브랜드 보라색 중심, 차분한 그레이와 보라 포인트'}
    ],
    build:v=>`${safe(v.object)}을/를,
깔끔한 3D 아이콘 스타일로,
핵심만 보이는 단순한 형태 · 균형이 잘 잡힌 형태 · 납작하지 않고 입체감이 느껴지는 형태로 만들어줘.

표면은 매끄럽고 깨끗하며 흠집이 없는 상태로,
과한 광택은 줄이고 자연스러운 매트한 느낌 또는 은은한 반사감이 나게 해줘.
재질은 ${safe(v.material)}처럼 느껴지게 해줘.

구도는 ${safe(v.angle)}으로,
빛은 그림자가 거의 없이 부드럽고 균일하게 들어오게 해줘.
색상은 ${safe(v.color)} 느낌으로 정리해줘.

배경은 완전히 투명 PNG로 만들어줘.
체커보드 배경, 바닥 그림자, 텍스트 라벨, 숫자, 글자는 제외해줘.`
  },
  {
    id:'softclay',
    name:'소프트 클레이 오브제',
    tag:'object',
    desc:'부드럽고 친근한 클레이/말랑한 3D 오브제',
    fields:[
      {id:'object',label:'오브제 이름',type:'text',placeholder:'예: 저금통, 새싹, 동전 타워'},
      {id:'mood',label:'분위기',type:'select',options:['따뜻하고 친근한','귀엽고 말랑한','차분하고 안정적인','밝고 희망적인']},
      {id:'palette',label:'색상',type:'text',placeholder:'예: 파스텔 보라와 크림톤, 연한 민트와 화이트'},
      {id:'angle',label:'구도',type:'select',options:['중앙에 단독 배치','살짝 비스듬한 45도 각도','가까이서 크게 보이는 구도']}
    ],
    build:v=>`${safe(v.object)}을/를,
부드러운 클레이 3D 오브제 스타일로,
전체적으로 ${safe(v.mood)} 인상이 느껴지게 만들어줘.

형태는 둥글고 말랑하지만 너무 유아적이지 않게,
핵심 실루엣이 한눈에 보이도록 단순하고 균형 있게 정리해줘.
색상은 ${safe(v.palette)} 중심으로 부드럽게 구성해줘.

구도는 ${safe(v.angle)}로,
빛은 확산광처럼 부드럽고 그림자는 아주 약하게 처리해줘.

배경은 투명 PNG로 만들어줘.
글자, 숫자, 과한 장식, 복잡한 배경, 강한 바닥 그림자는 제외해줘.`
  },
  {
    id:'premium',
    name:'프리미엄 제품 컷',
    tag:'visual',
    desc:'금융 상품/캠페인 키비주얼에 맞는 고급스러운 제품 사진 톤',
    fields:[
      {id:'subject',label:'주요 대상',type:'text',placeholder:'예: 집 모형과 열쇠, 금고와 계약서'},
      {id:'surface',label:'배치 표면',type:'select',options:['매트한 다크 그레이 표면','깨끗한 화이트 스튜디오 표면','차분한 베이지 톤 표면','반사가 약한 블랙 표면']},
      {id:'lighting',label:'조명',type:'select',options:['부드러운 스튜디오 조명','측면에서 들어오는 고급스러운 빛','상단에서 은은하게 떨어지는 빛','차분한 저채도 조명']},
      {id:'accent',label:'강조 색',type:'text',placeholder:'예: 보라색 포인트, 은은한 골드 포인트'}
    ],
    build:v=>`${safe(v.subject)}을/를 중심으로,
프리미엄 금융 브랜드의 제품 컷처럼 고급스럽고 정돈된 장면으로 만들어줘.

오브제는 ${safe(v.surface)} 위에 안정적으로 배치하고,
전체 구성은 여백이 충분하며 과하게 장식적이지 않게 정리해줘.
조명은 ${safe(v.lighting)}으로,
표면 질감과 형태가 선명하게 보이되 너무 번쩍이지 않게 해줘.

색감은 차분한 뉴트럴 톤을 기본으로 하고,
${safe(v.accent)}가 자연스럽게 시선을 끌게 해줘.

카메라는 제품 촬영처럼 깔끔한 정면 또는 약간 비스듬한 구도로 잡아줘.
텍스트, 로고, 숫자, 사람, 복잡한 배경은 제외해줘.`
  },
  {
    id:'cinematic',
    name:'시네마틱 상황 묘사',
    tag:'scene',
    desc:'메시지를 장면 전체로 보여주는 드라마틱한 키비주얼',
    fields:[
      {id:'message',label:'전달 메시지',type:'text',placeholder:'예: 빠른 승인, 막힌 상황의 해결, 꾸준한 성장'},
      {id:'place',label:'배경 환경',type:'text',placeholder:'예: 도시 야경, 아파트 단지, 어두운 복도'},
      {id:'visual',label:'핵심 장면',type:'textarea',placeholder:'예: 하나의 창문에만 따뜻한 빛이 켜지는 장면'},
      {id:'tone',label:'톤',type:'select',options:['따뜻하고 희망적인','차갑지만 곧 해결될 듯한','웅장하고 신뢰감 있는','조용하고 안도감 있는']}
    ],
    build:v=>`${safe(v.place)}을 배경으로,
${safe(v.message)} 메시지가 장면 전체에서 자연스럽게 느껴지도록 만들어줘.

핵심 장면은 ${safe(v.visual)}으로 구성하고,
주변은 절제되어 있지만 중심 요소는 분명하게 도드라지게 해줘.

전체 분위기는 ${safe(v.tone)} 느낌으로,
빛과 그림자의 대비를 활용하되 과하게 어둡거나 공포스럽지 않게 정리해줘.

카메라는 광고 키비주얼처럼 안정적인 구도로 잡고,
색감은 브랜드에 맞는 보라 포인트와 차분한 뉴트럴 톤을 함께 사용해줘.

글자, 로고, 숫자, 현수막, 과도한 인물 표현은 제외해줘.`
  },
  {
    id:'flatgraphic',
    name:'플랫 벡터 그래픽',
    tag:'graphic',
    desc:'랜딩/배너에 쓰기 좋은 단순하고 명확한 벡터형 그래픽',
    fields:[
      {id:'object',label:'오브제/장면',type:'text',placeholder:'예: 신청 완료 화면, 우상향 그래프, 열린 자물쇠'},
      {id:'style',label:'그래픽 톤',type:'select',options:['미니멀하고 명확한','친근하고 둥근','차분하고 신뢰감 있는','밝고 경쾌한']},
      {id:'palette',label:'색상',type:'text',placeholder:'예: 보라색 중심, 그레이와 화이트 바탕'},
      {id:'composition',label:'구성',type:'select',options:['중앙에 크게 배치','좌우 균형 있게 배치','넉넉한 여백을 둔 배치','아이콘 몇 개가 질서 있게 모인 구성']}
    ],
    build:v=>`${safe(v.object)}을/를,
깔끔한 플랫 벡터 그래픽 스타일로 만들어줘.

전체 톤은 ${safe(v.style)} 느낌으로,
선과 면을 단순하게 정리하고 불필요한 디테일은 줄여줘.
색상은 ${safe(v.palette)} 중심으로 사용하고,
구성은 ${safe(v.composition)}로 잡아줘.

그림자는 거의 없거나 아주 약하게,
형태는 한눈에 이해되도록 명확하게 표현해줘.

텍스트, 숫자, 로고, 복잡한 배경, 과한 패턴은 제외해줘.`
  }
];

let currentId = presets[0].id;
const values = {};
let history = [];

function currentPreset(){ return presets.find(p=>p.id===currentId); }
function safe(v){ return (v||'[입력 필요]').trim() || '[입력 필요]'; }
function esc(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderPresets(){
  document.getElementById('preset-list').innerHTML = presets.map(p=>`
    <button class="preset-btn${p.id===currentId?' active':''}" onclick="selectPreset('${p.id}')">
      <div class="preset-name">${p.name}<span class="preset-chip">${p.tag}</span></div>
      <div class="preset-desc">${p.desc}</div>
    </button>
  `).join('');
}

function renderFields(){
  const p = currentPreset();
  values[p.id] = values[p.id] || {};
  document.getElementById('field-list').innerHTML = p.fields.map(f=>{
    const val = values[p.id][f.id] || '';
    if(f.type==='select'){
      return `<div class="field">
        <label for="${f.id}">${f.label}</label>
        <select id="${f.id}" onchange="setValue('${f.id}',this.value)">
          ${f.options.map((o,i)=>`<option value="${esc(o)}" ${(!val&&i===0)||val===o?'selected':''}>${esc(o)}</option>`).join('')}
        </select>
      </div>`;
    }
    if(f.type==='textarea'){
      return `<div class="field">
        <label for="${f.id}">${f.label}</label>
        <textarea id="${f.id}" placeholder="${esc(f.placeholder)}" oninput="setValue('${f.id}',this.value)">${esc(val)}</textarea>
      </div>`;
    }
    return `<div class="field">
      <label for="${f.id}">${f.label}</label>
      <input id="${f.id}" type="text" value="${esc(val)}" placeholder="${esc(f.placeholder)}" oninput="setValue('${f.id}',this.value)">
    </div>`;
  }).join('');
  p.fields.filter(f=>f.type==='select').forEach(f=>{
    if(!values[p.id][f.id]) values[p.id][f.id] = f.options[0];
  });
}

function selectPreset(id){
  currentId = id;
  renderPresets();
  renderFields();
  updatePrompt();
}

function setValue(id,value){
  values[currentId] = values[currentId] || {};
  values[currentId][id] = value;
  updatePrompt();
}

function updatePrompt(){
  const p = currentPreset();
  const output = document.getElementById('prompt-output');
  const text = p.build(values[p.id] || {});
  output.value = text;
  document.getElementById('prompt-title').textContent = p.name;
  document.getElementById('count').textContent = `${text.length}자`;
}

function copyPrompt(){
  const text = document.getElementById('prompt-output').value.trim();
  if(!text) return;
  navigator.clipboard.writeText(text).then(()=>{
    const btn = document.getElementById('copy-btn');
    btn.textContent = '복사됨 ✓';
    setTimeout(()=>btn.textContent='복사하기',1500);
  });
}

function savePrompt(){
  const text = document.getElementById('prompt-output').value.trim();
  if(!text) return;
  history.unshift({preset:currentPreset().name,text,createdAt:Date.now()});
  persistHistory();
  renderHistory();
}

function renderHistory(){
  const el = document.getElementById('history-list');
  if(!history.length){ el.innerHTML = '<div class="empty">저장된 프롬프트가 없습니다.</div>'; return; }
  el.innerHTML = history.map((h,i)=>`<div class="h-item" onclick="navigator.clipboard.writeText(history[${i}].text)">
    <div class="h-cat">${esc(h.preset)}</div>
    ${esc(h.text).slice(0,260)}${h.text.length>260?'...':''}
    <span class="h-del" onclick="event.stopPropagation();deleteHistory(${i})">×</span>
  </div>`).join('');
}

function deleteHistory(i){
  history.splice(i,1);
  persistHistory();
  renderHistory();
}

function persistHistory(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(history)); }
  catch(e){ console.warn('히스토리를 저장하지 못했습니다.', e); }
}

function loadHistory(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    history = raw ? JSON.parse(raw) : [];
    if(!Array.isArray(history)) history = [];
  }catch(e){ history = []; }
}
function exportToneHistory(){
  const payload = {
    app:'8percent-tone-manner-prompt-builder',
    version:1,
    exportedAt:new Date().toISOString(),
    storageKey:STORAGE_KEY,
    history
  };
  downloadHistoryFile(payload, `8percent-tone-builder-history-${dateStamp()}.json`);
}
function importToneHistory(event){
  const file = event.target.files && event.target.files[0];
  event.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(String(reader.result || '{}'));
      const incoming = Array.isArray(data) ? data : data.history;
      if(!Array.isArray(incoming)) throw new Error('invalid history file');
      mergeToneHistory(incoming);
      persistHistory();
      renderHistory();
      alert('히스토리를 가져왔습니다.');
    }catch(e){
      alert('히스토리 파일을 읽지 못했습니다. 올바른 JSON 파일인지 확인해주세요.');
    }
  };
  reader.readAsText(file);
}
function mergeToneHistory(incoming){
  const seen = new Set(history.map(h => `${h.preset || ''}::${h.text || ''}`));
  incoming.forEach(item => {
    if(!item || !item.text) return;
    const key = `${item.preset || ''}::${item.text || ''}`;
    if(seen.has(key)) return;
    history.push({...item});
    seen.add(key);
  });
}
function downloadHistoryFile(payload, filename){
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function dateStamp(){
  const d = new Date();
  return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
}

loadHistory();
renderPresets();
renderFields();
updatePrompt();
renderHistory();
</script>
